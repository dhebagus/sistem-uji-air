<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Uji pH & TDS Air Toko Royalti</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }
        .glass-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }
        .form-control {
            background: #f8fafc !important;
            border: 1px solid #cbd5e1;
            color: #1e293b !important;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-weight: 500;
        }
        .form-control:focus {
            background: #ffffff !important;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }
        .demo-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card glass-card p-4 p-md-5">
                    <div class="text-center mb-5">
                        <div class="mb-4 position-relative d-inline-block">
                            <div class="position-absolute top-50 start-50 translate-middle bg-primary rounded-circle blur-3xl opacity-20" style="width: 120px; height: 120px;"></div>
                            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="rounded-4 shadow-lg position-relative" style="width: 80px; height: 80px; object-fit: cover; border: 2px solid rgba(255,255,255,0.1);">
                        </div>
                        <h3 class="fw-extrabold text-dark tracking-tight mb-1" style="font-weight: 800;">Royalti<span class="text-primary">Water</span></h3>
                        <p class="text-muted small fw-medium">Sistem Monitoring Kualitas Air Minum</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger alert-dismissible fade show small rounded-3 fw-semibold mb-3" role="alert">
                                    <i class="fa-solid fa-circle-exclamation me-2"></i> {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark small text-uppercase" style="font-size: 11px; letter-spacing: 0.05em;">Username</label>
                            <div class="position-relative">
                                <i class="fa-solid fa-user position-absolute top-50 translate-middle-y ms-3 text-muted"></i>
                                <input type="text" name="username" class="form-control ps-5" placeholder="Masukkan username..." required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark small text-uppercase" style="font-size: 11px; letter-spacing: 0.05em;">Password</label>
                            <div class="position-relative">
                                <i class="fa-solid fa-lock position-absolute top-50 translate-middle-y ms-3 text-muted"></i>
                                <input type="password" name="password" class="form-control ps-5" placeholder="Masukkan password..." required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            LOGIN SISTEM <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <div class="demo-box p-3 mt-4 small">
                        <span class="fw-bold text-dark d-block mb-2 text-uppercase" style="font-size: 10px; letter-spacing: 0.1em;">Credentials Akses Cepat</span>
                        <div class="d-flex justify-content-between mb-1 text-muted"><span>Owner:</span> <code class="text-primary fw-bold">owner</code></div>
                        <div class="d-flex justify-content-between mb-1 text-muted"><span>Admin:</span> <code class="text-primary fw-bold">admin</code></div>
                        <div class="d-flex justify-content-between text-muted"><span>Staff:</span> <code class="text-primary fw-bold">staff1</code></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
